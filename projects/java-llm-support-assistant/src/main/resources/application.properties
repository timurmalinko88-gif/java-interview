spring.application.name=java-llm-support-assistant
server.port=8080

# LLM Configuration
# Official API documentation reference: https://platform.openai.com/docs/api-reference/chat/create
# Verified date: 2026-03-01
llm.provider=openai
llm.api-key=${LLM_API_KEY:mock-api-key}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.model=${LLM_MODEL:gpt-4o-mini}
llm.timeout-seconds=15
llm.max-retries=3
llm.max-loop-iterations=5

# Logging
logging.level.com.example.assistant=INFO
